<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DepthWizard system architecture</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #fff;
    width: 1920px;
    height: 1240px;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: #111827;
  }
  svg { display: block; width: 1920px; height: 1240px; }
</style>
</head>
<body>
<svg width="1920" height="1240" viewBox="0 0 1920 1240">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="48" y="52" font-size="36" font-weight="650" font-family="Segoe UI, Helvetica, Arial, sans-serif">DepthWizard · System architecture</text>
  <text x="48" y="88" font-size="20" fill="#4b5563" font-family="Segoe UI, Helvetica, Arial, sans-serif">SIH26175. One optical image becomes a relative height map, then slope, a flood-prone mask, and a 3D terrain view.</text>

  <g fill="none" stroke="#374151" stroke-width="1.6">
    <line x1="490" y1="224" x2="490" y2="242"/>
    <line x1="1430" y1="224" x2="1430" y2="242"/>
    <line x1="490" y1="242" x2="1430" y2="242"/>
    <line x1="960" y1="242" x2="960" y2="264" marker-end="url(#arr)"/>

    <line x1="960" y1="352" x2="960" y2="374" marker-end="url(#arr)"/>

    <line x1="960" y1="462" x2="960" y2="480"/>
    <line x1="498" y1="480" x2="1422" y2="480"/>
    <line x1="498" y1="480" x2="498" y2="500" marker-end="url(#arr)"/>
    <line x1="1422" y1="480" x2="1422" y2="500" marker-end="url(#arr)"/>

    <line x1="498" y1="600" x2="498" y2="618"/>
    <line x1="1422" y1="600" x2="1422" y2="618"/>
    <line x1="498" y1="618" x2="1422" y2="618"/>
    <line x1="960" y1="618" x2="960" y2="640" marker-end="url(#arr)"/>

    <line x1="960" y1="728" x2="960" y2="746"/>
    <line x1="328" y1="746" x2="1592" y2="746"/>
    <line x1="328" y1="746" x2="328" y2="766" marker-end="url(#arr)"/>
    <line x1="960" y1="746" x2="960" y2="766" marker-end="url(#arr)"/>
    <line x1="1592" y1="746" x2="1592" y2="766" marker-end="url(#arr)"/>

    <line x1="328" y1="888" x2="328" y2="906"/>
    <line x1="960" y1="888" x2="960" y2="906"/>
    <line x1="1592" y1="888" x2="1592" y2="906"/>
    <line x1="328" y1="906" x2="1592" y2="906"/>
    <line x1="960" y1="906" x2="960" y2="926" marker-end="url(#arr)"/>

    <line x1="960" y1="1014" x2="960" y2="1032"/>
    <line x1="256" y1="1032" x2="1664" y2="1032"/>
    <line x1="256" y1="1032" x2="256" y2="1052" marker-end="url(#arr)"/>
    <line x1="720" y1="1032" x2="720" y2="1052" marker-end="url(#arr)"/>
    <line x1="1184" y1="1032" x2="1184" y2="1052" marker-end="url(#arr)"/>
    <line x1="1664" y1="1032" x2="1664" y2="1052" marker-end="url(#arr)"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="80" y="124" width="820" height="100" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="490" y="168" text-anchor="middle" font-size="28" font-weight="650">Operator upload</text>
    <text x="490" y="202" text-anchor="middle" font-size="22" fill="#4b5563">PNG or JPG. One view. No stereo pair.</text>

    <rect x="1020" y="124" width="820" height="100" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="1430" y="168" text-anchor="middle" font-size="28" font-weight="650">Reference tiles</text>
    <text x="1430" y="202" text-anchor="middle" font-size="22" fill="#4b5563">Mountain ridge, coastal plain, urban settlement</text>

    <rect x="360" y="264" width="1200" height="88" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="960" y="302" text-anchor="middle" font-size="28" font-weight="650">Browser workstation</text>
    <text x="960" y="334" text-anchor="middle" font-size="22" fill="#4b5563">Preview the image, then send the file.</text>

    <rect x="360" y="374" width="1200" height="88" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="960" y="412" text-anchor="middle" font-size="28" font-weight="650">FastAPI</text>
    <text x="960" y="444" text-anchor="middle" font-size="22" fill="#4b5563">POST /api/generate-depth. Unreadable files are rejected.</text>

    <rect x="48" y="500" width="900" height="100" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="498" y="544" text-anchor="middle" font-size="28" font-weight="650">Depth Anything V2</text>
    <text x="498" y="578" text-anchor="middle" font-size="22" fill="#4b5563">Monocular model, used when the weights are loaded.</text>

    <rect x="972" y="500" width="900" height="100" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="1422" y="544" text-anchor="middle" font-size="28" font-weight="650">Demo height path</text>
    <text x="1422" y="578" text-anchor="middle" font-size="22" fill="#4b5563">Photo brightness turned into relative height.</text>

    <rect x="360" y="640" width="1200" height="88" rx="3" fill="#e8f1fb" stroke="#1e4d8c" stroke-width="1.8"/>
    <text x="960" y="678" text-anchor="middle" font-size="28" font-weight="650">Relative height map</text>
    <text x="960" y="710" text-anchor="middle" font-size="22" fill="#1f2937">Grayscale PNG. Brighter pixels are higher, from 0 to 255.</text>

    <rect x="48" y="766" width="560" height="122" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="328" y="808" text-anchor="middle" font-size="26" font-weight="650">Slope map</text>
    <text x="328" y="842" text-anchor="middle" font-size="20" fill="#4b5563">Sobel gradient of the height map.</text>
    <text x="328" y="868" text-anchor="middle" font-size="20" fill="#4b5563">Slope image, plus mean and maximum.</text>

    <rect x="680" y="766" width="560" height="122" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="960" y="808" text-anchor="middle" font-size="26" font-weight="650">Flood-prone mask</text>
    <text x="960" y="842" text-anchor="middle" font-size="20" fill="#4b5563">Cells at or below the 20th percentile.</text>
    <text x="960" y="868" text-anchor="middle" font-size="20" fill="#4b5563">Mask image and the percent of the scene.</text>

    <rect x="1312" y="766" width="560" height="122" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="1592" y="808" text-anchor="middle" font-size="26" font-weight="650">Height statistics</text>
    <text x="1592" y="842" text-anchor="middle" font-size="20" fill="#4b5563">Minimum, maximum, mean, and spread.</text>
    <text x="1592" y="868" text-anchor="middle" font-size="20" fill="#4b5563">Request time in milliseconds.</text>

    <rect x="360" y="926" width="1200" height="88" rx="3" fill="#fff" stroke="#111827" stroke-width="1.6"/>
    <text x="960" y="964" text-anchor="middle" font-size="28" font-weight="650">Response to the browser</text>
    <text x="960" y="996" text-anchor="middle" font-size="22" fill="#4b5563">JSON with the depth PNG, slope PNG, flood mask, and the statistics.</text>

    <rect x="36" y="1052" width="440" height="140" rx="3" fill="#f4f7f5" stroke="#1f4a38" stroke-width="1.6"/>
    <text x="256" y="1090" text-anchor="middle" font-size="24" font-weight="650">3D terrain</text>
    <text x="256" y="1118" text-anchor="middle" font-size="18" fill="#374151">Three.js surface from the height map.</text>
    <text x="256" y="1142" text-anchor="middle" font-size="18" fill="#374151">Photo, height colors, or slope.</text>
    <text x="256" y="1166" text-anchor="middle" font-size="18" fill="#374151">Shaded surface or wireframe.</text>

    <rect x="500" y="1052" width="440" height="140" rx="3" fill="#f4f7f5" stroke="#1f4a38" stroke-width="1.6"/>
    <text x="720" y="1090" text-anchor="middle" font-size="24" font-weight="650">Camera and scale</text>
    <text x="720" y="1118" text-anchor="middle" font-size="18" fill="#374151">Orbit inspect, or WASD flythrough.</text>
    <text x="720" y="1142" text-anchor="middle" font-size="18" fill="#374151">Height scale comes from the relief.</text>
    <text x="720" y="1166" text-anchor="middle" font-size="18" fill="#374151">Exaggeration from 0.5× to 4×.</text>

    <rect x="964" y="1052" width="440" height="140" rx="3" fill="#f4f7f5" stroke="#1f4a38" stroke-width="1.6"/>
    <text x="1184" y="1090" text-anchor="middle" font-size="24" font-weight="650">Water and triage</text>
    <text x="1184" y="1118" text-anchor="middle" font-size="18" fill="#374151">Water plane at the chosen level.</text>
    <text x="1184" y="1142" text-anchor="middle" font-size="18" fill="#374151">Submerged area from the height map.</text>
    <text x="1184" y="1166" text-anchor="middle" font-size="18" fill="#374151">Max slope, mean slope, area over 30°.</text>

    <rect x="1428" y="1052" width="440" height="140" rx="3" fill="#f4f7f5" stroke="#1f4a38" stroke-width="1.6"/>
    <text x="1648" y="1090" text-anchor="middle" font-size="24" font-weight="650">Reference and export</text>
    <text x="1648" y="1118" text-anchor="middle" font-size="18" fill="#374151">Click a point and enter elevation.</text>
    <text x="1648" y="1142" text-anchor="middle" font-size="18" fill="#374151">Download the depth and slope PNGs.</text>
    <text x="1648" y="1166" text-anchor="middle" font-size="18" fill="#374151">Or save a screenshot of the view.</text>
  </g>
</svg>
</body>
</html>
